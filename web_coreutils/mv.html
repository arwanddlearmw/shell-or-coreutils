<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>mv documentition</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; }
        code { background-color: #ffffff; padding: 2px 6px; border-radius: 4px; }
        pre code { display: block; padding: 10px; background-color: #f4f4f4; }
    </style>
</head>

<body>
    <h1>mv</h1>
    <p>its move the file from first_path to second_path
    </p>
    <h4>example:</h4>
    <p>we have a file name : test.txt 
        and we need to move the file to a Documents
        without copy two version of this file
        we just do :
    </p>
    <pre><code>mv test.txt ~/Documents</code></pre>
    <p>and thats it.</p>
</body>
